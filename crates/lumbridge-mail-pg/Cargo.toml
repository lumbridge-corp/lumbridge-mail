[package]
name = "lumbridge-mail-pg"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "Lumbridge Mail: the one-way Postgres mirror (schema migrations, row shapes, the writer)"

[dependencies]
lumbridge-mail-core = { path = "../lumbridge-mail-core" }
# Bodies go to Postgres as clean text and the sanitised block tree, never as received HTML.
lumbridge-mail-render = { path = "../lumbridge-mail-render" }
tokio-postgres = { version = "0.7.18", default-features = false, features = ["runtime", "with-serde_json-1"] }
# TLS through rustls (no OpenSSL), ring as the crypto provider (the imap crate uses it too).
tokio-postgres-rustls = { version = "0.14", features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1.12", features = ["std"] }
webpki-roots = "1"
futures = "0.3"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
