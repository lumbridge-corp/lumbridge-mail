[package]
name = "lumbridge-mail-gog"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Lumbridge Mail: a Gmail Provider that drives the gog CLI (which holds the OAuth tokens)"

[dependencies]
lumbridge-mail-core = { path = "../lumbridge-mail-core" }
async-trait = "0.1"
base64 = "0.22"
encoding_rs = "0.8"
futures = "0.3"
# No default features: we always set our own Message-ID, so the builder never needs the host name.
mail-builder = { version = "2.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time", "test-util"] }
