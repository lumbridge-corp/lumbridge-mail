[package]
name = "lumbridge-mail-store"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Lumbridge Mail: the SQLite mail cache, durable action queue and full-text search"

[dependencies]
lumbridge-mail-core = { path = "../lumbridge-mail-core" }
# Plain text of HTML-only bodies for the search index.
lumbridge-mail-render = { path = "../lumbridge-mail-render" }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
