[package]
name = "lumbridge-mail-imap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
description = "Lumbridge Mail: the IMAP (read) and SMTP (send) provider"

[dependencies]
lumbridge-mail-core = { path = "../lumbridge-mail-core" }
async-trait = "0.1"
# IMAP client: tokio runtime, IDLE, CONDSTORE/QRESYNC responses, AUTHENTICATE. See README "Why async-imap".
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
# INTERNALDATE parsing (already in the tree through async-imap).
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["net", "time", "sync", "io-util", "rt", "fs", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
webpki-roots = "1"
# SMTP: STARTTLS / implicit TLS over rustls, PLAIN / LOGIN / XOAUTH2. No `hostname` feature: we never tell
# the server our machine's name.
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder"] }
mail-parser = { version = "0.11", features = ["full_encoding"] }
# Building outgoing MIME (drafts may have no recipients yet, which lettre's builder refuses).
mail-builder = { version = "2.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# SRV lookups for autodiscovery (only when the caller asks for it).
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio", "system-config"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
