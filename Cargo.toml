[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/lumbridge-corp/lumbridge-mail"
homepage = "https://lumbridgecorp.com"
publish = false
rust-version = "1.97"

[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 4
