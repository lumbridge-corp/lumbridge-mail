# The scrub check, clippy and the whole test suite (scripts/ci.sh), on a GitHub-hosted runner.
# No secrets are needed. Actions are pinned to a commit.
name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUST_VERSION: 1.97.1
      # The hosted runner has about 14 GB free; a debug build of this workspace with full
      # debug info fills it. No debug info and no incremental cache keep it well under.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Free disk space (preinstalled toolchains this repo does not use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: System packages (the same as the README's install section)
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev mesa-vulkan-drivers libfontconfig-dev libfreetype-dev libdbus-1-dev \
            libnotify-bin
      - name: Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
      - name: Checks (scripts/ci.sh)
        run: scripts/ci.sh
